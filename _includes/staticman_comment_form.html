<!-- e.g. "2016-01-02-this-is-a-post" -->
<form id="commentForm" method="POST" action="{{ site.staticman_post_url }}">
    <input name="options[redirect]" type="hidden" value="{{ site.url }}">
    <input name="options[slug]" type="hidden" value="{{ page.permalink | slugify }}">
    <label>Name<input name="fields[name]" type="text" required></label>
    <label>E-mail<input name="fields[email]" type="email" ></label>
    <label>Message<textarea name="fields[message]" required></textarea></label>
    <button type="submit">Submit Comment</button>
</form>

<div id="thankYouMessage" style="display: none;">Thank you for your comment!</div>

<script>
    document.getElementById('commentForm').addEventListener('submit', function(event) {
        event.preventDefault();
        var formData = new FormData(this);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', this.action, true);

        xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 400) {
                document.getElementById('commentForm').style.display = 'none';
                document.getElementById('thankYouMessage').style.display = 'block';
            } else {
                alert('There was a problem with your submission. Please try again.');
            }
        };

        xhr.send(formData);
    });
</script>
